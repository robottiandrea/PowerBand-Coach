<!doctype html>
<html lang="it">
<head>

<title>PowerBand Coach · Allenamento a casa</title>
<style>
:root{color-scheme:dark;--bg:#0c0f15;--panel:#171c26;--panel2:#212734;--txt:#f4f6f7;--muted:#99a4b4;--lime:#c8ff64;--border:#303747;--danger:#ff8b8b;--soft:#10151d}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}h1,h2,h3,p{margin:0}#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 20px calc(104px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:23px 0 30px}.brand{font-size:16px;font-weight:900;letter-spacing:-.45px}.brand b{color:var(--lime)}.brand-sub{display:block;margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:2.6px;font-weight:700}.date{color:var(--muted);font-size:12px;text-transform:capitalize;text-align:right}.eyebrow{color:var(--lime);font-size:11px;font-weight:850;letter-spacing:2.1px;text-transform:uppercase}.headline{font-size:clamp(30px,9vw,44px);line-height:1.09;letter-spacing:-1.7px;font-weight:850;margin:13px 0 12px}.headline em{font-style:normal;color:var(--lime)}.desc{font-size:14px;color:var(--muted);line-height:1.55}.section{margin-top:32px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-title{font-size:18px;font-weight:800;letter-spacing:-.45px}.subtle{font-size:12px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:21px;padding:20px}.hero{background:linear-gradient(135deg,#273719,#18231e 60%,#17202a);border:1px solid #476033;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:205px;height:205px;border:35px solid rgba(200,255,100,.05);border-radius:50%;right:-95px;top:-92px;pointer-events:none}.hero-head{display:flex;align-items:center;justify-content:space-between}.tag{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:rgba(200,255,100,.11);color:var(--lime);font-size:11px;font-weight:800;letter-spacing:1px}.big-letter{font-size:64px;line-height:1;font-weight:950;letter-spacing:-5px;margin:17px 0 3px}.workout-name{font-size:20px;font-weight:820;letter-spacing:-.5px}.workout-details{font-size:12px;color:#c0cfb6;margin-top:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 17px;border-radius:13px;font-weight:820;font-size:14px;border:0}.btn-primary{background:var(--lime);color:#10170b}.btn-secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--border)}.btn-ghost{background:transparent;color:var(--muted)}.btn-danger{background:#382023;color:#ffb0b0;border:1px solid #633437}.btn-wide{width:100%}.hero .btn{position:relative;margin-top:24px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:12px 2px;text-align:center}.weekday.today{border-color:var(--lime);background:#283424}.weekday .dayname{display:block;color:var(--muted);font-size:10px;margin-bottom:8px}.weekday .daycode{font-size:13px;font-weight:800}.weekday.rest .daycode{color:#8993a3}.workout-grid{display:grid;gap:9px}.workout-tile{display:flex;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px;width:100%;color:inherit}.tile-letter{display:flex;align-items:center;justify-content:center;flex-shrink:0;height:50px;width:50px;border-radius:13px;font-weight:950;font-size:24px;color:#151a11;background:var(--lime)}.tile-mid{flex:1;min-width:0}.tile-name{font-weight:800;font-size:15px}.tile-desc{font-size:12px;color:var(--muted);margin-top:5px}.arrow{font-size:24px;color:#778395}.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:17px}.stat-number{font-size:28px;font-weight:900;letter-spacing:-1px}.stat-caption{color:var(--muted);font-size:11px;margin-top:5px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(12,15,21,.95);border-top:1px solid var(--border);padding:10px max(15px,calc((100vw - 530px)/2)) calc(11px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;backdrop-filter:blur(18px)}.nav-item{border:0;background:none;color:#8a97a7;padding:7px 9px;min-width:65px;font-size:10px;font-weight:750;display:flex;align-items:center;gap:5px;flex-direction:column}.nav-item.active{color:var(--lime)}.nav-icon{font-size:20px;line-height:22px}.link{background:transparent;border:0;color:var(--lime);font-size:13px;font-weight:750;padding:5px}.exercise-row{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--border)}.exercise-row:last-child{border-bottom:none}.index-circle{display:flex;align-items:center;justify-content:center;min-width:32px;height:32px;border-radius:10px;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:900}.exercise-content{flex:1;min-width:0}.exercise-title{font-size:14px;font-weight:790}.exercise-detail{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}.exercise-metric{font-size:13px;font-weight:800;color:var(--lime);white-space:nowrap}.detail-notes{font-size:13px;line-height:1.6;color:#b2bccb}.muted-note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:13px}.details-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{background:var(--panel);color:var(--txt);border:1px solid var(--border);border-radius:11px;width:40px;height:40px;font-size:19px;flex-shrink:0}.detail-name{font-size:25px;letter-spacing:-.9px;font-weight:850}.detail-actions{display:flex;gap:10px;margin-top:20px}.detail-actions .btn:first-child{flex:1}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:7px}.field label{color:var(--muted);font-size:12px}.field input{width:100%;background:#0f141d;color:white;border:1px solid var(--border);border-radius:11px;min-height:43px;padding:8px 11px;font-size:16px}.settings-card{margin-bottom:14px}.settings-label{font-size:14px;font-weight:800;margin-bottom:14px}.options{display:flex;flex-wrap:wrap;gap:8px}.pill{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:10px 15px;font-weight:800;font-size:13px}.pill.active{background:var(--lime);color:#12170d;border-color:var(--lime)}.toggle-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.switch{width:50px;height:30px;border-radius:20px;background:#424a57;border:0;padding:3px}.switch.on{background:var(--lime)}.knob{display:block;background:#fff;width:24px;height:24px;border-radius:100px;transition:transform .2s}.switch.on .knob{transform:translateX(20px);background:#17210b}.workout-mode{padding-top:9px}.running-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.progress-track{height:7px;border-radius:15px;background:#303745;overflow:hidden;margin:15px 0 26px}.progress-fill{height:100%;background:var(--lime);border-radius:15px;transition:width .25s}.exercise-hero{padding:25px 22px;text-align:center}.step-badge{color:var(--lime);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:850}.active-ex-title{font-size:28px;line-height:1.16;letter-spacing:-.8px;font-weight:880;margin:12px 0}.rep-range{font-size:13px;color:var(--muted);margin-top:8px}.counter{display:flex;align-items:center;justify-content:center;gap:20px;margin:25px 0 21px}.count-button{width:52px;height:52px;border-radius:15px;border:1px solid var(--border);background:var(--panel2);color:var(--txt);font-size:28px;font-weight:550}.count-number{min-width:70px;text-align:center;font-size:58px;font-weight:900;line-height:1;letter-spacing:-3px}.count-label{text-align:center;font-size:11px;color:var(--muted);margin-top:-7px;margin-bottom:20px}.session-actions{display:flex;gap:10px}.session-actions .btn:first-child{flex:1}.set-dots{display:flex;justify-content:center;gap:8px;margin-top:16px}.set-dot{height:9px;width:9px;border-radius:50%;background:#465061}.set-dot.done{background:var(--lime)}.set-dot.current{box-shadow:0 0 0 3px rgba(200,255,100,.22)}.next-ex{margin-top:16px;background:#10161d;border:1px solid var(--border);padding:15px;border-radius:15px}.rest-card{background:linear-gradient(145deg,#27371e,#1b2626);border:1px solid #506839;border-radius:22px;padding:25px 20px;text-align:center}.timer-disc{width:216px;height:216px;margin:22px auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:conic-gradient(var(--lime) 100%,#3a4732 0);position:relative}.timer-disc:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#1d2922}.timer-content{position:relative;z-index:1}.timer-number{font-size:69px;font-weight:900;letter-spacing:-4px;line-height:1}.timer-sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px}.time-actions{display:flex;gap:9px;justify-content:center;margin-top:17px}.time-actions .btn{min-width:90px}.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--border)}.history-item:last-child{border:none}.history-icon{min-width:42px;height:42px;border-radius:13px;background:#2b3926;color:var(--lime);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}.history-main{flex:1}.history-name{font-size:14px;font-weight:800}.history-sub{font-size:11px;color:var(--muted);margin-top:6px}.empty{padding:35px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.notice{background:#222918;border:1px solid #4a5a32;border-radius:13px;padding:13px;font-size:12px;color:#c5d5b3;line-height:1.5}.modal-shade{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--panel);border:1px solid var(--border);border-radius:22px 22px 0 0;max-width:560px;width:100%;max-height:86dvh;overflow:auto;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}.modal-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:19px}.edit-row{border-top:1px solid var(--border);padding:14px 0}.edit-title{font-size:13px;font-weight:780;margin-bottom:11px}.edit-input-row{display:flex;gap:9px}.edit-input-row .field{flex:1}.modal h2{font-size:22px;letter-spacing:-.5px}.small-btn{padding:6px 9px;border-radius:9px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:12px}.footer-note{padding:26px 0;color:#758394;font-size:11px;line-height:1.5}.install-banner{display:flex;align-items:center;gap:10px}.nowrap{white-space:nowrap}@media(min-width:650px){body{background:#090c11}#app{border-left:1px solid #242a35;border-right:1px solid #242a35} .modal{border-radius:22px;margin-bottom:25px}.modal-shade{align-items:flex-end}}@media(max-width:365px){#app{padding-left:13px;padding-right:13px}.week-grid{gap:4px}.weekday{padding:9px 1px}.counter{gap:12px}.timer-disc{width:188px;height:188px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{'use strict';
const DATA=[
{id:'A',name:'Petto e tricipiti',type:'PUSH',description:'Spinta · petto e braccia',ex:[
{id:'a1',name:'Push-up classici',sets:3,target:10,range:'8–15',desc:'Corpo in linea; scendi controllando. Aggiungi la power band solo quando sono facili.'},
{id:'a2',name:'Chest press con elastico',sets:3,target:12,range:'12–15',desc:'Power band dietro la schiena; spingi le mani in avanti.'},
{id:'a3',name:'Push-up presa stretta',sets:2,target:8,range:'6–12',desc:'Mani poco più strette delle spalle; mantieni i gomiti controllati.'},
{id:'a4',name:'Estensioni tricipiti con elastico',sets:2,target:12,range:'12–15',desc:'Elastico ben fermo sotto un piede; estendi il braccio sopra la testa.'}]},
{id:'B',name:'Schiena e bicipiti',type:'PULL',description:'Trazione · schiena e braccia',ex:[
{id:'b1',name:'Rematore con elastico',sets:3,target:12,range:'10–15',desc:'Power band sotto i piedi, busto inclinato e gomiti indietro.'},
{id:'b2',name:'Rematore da seduto',sets:3,target:12,range:'12–15',desc:'Fascia intorno ai piedi; tira verso l’addome con schiena neutra.'},
{id:'b3',name:'Band pull-apart',sets:2,target:15,range:'15–20',desc:'Braccia tese davanti al petto; allarga senza alzare le spalle.'},
{id:'b4',name:'Curl bicipiti con elastico',sets:3,target:12,range:'10–15',desc:'Gomiti fermi, ritorno lento e controllato.'}]},
{id:'C',name:'Gambe, spalle e addome',type:'LEGS + CORE',description:'Gambe · spalle · addome',ex:[
{id:'c1',name:'Squat con elastico',sets:3,target:15,range:'12–20',desc:'Elastico sotto i piedi e sopra le spalle, con presa sicura.'},
{id:'c2',name:'Stacchi rumeni con elastico',sets:3,target:12,range:'12–15',desc:'Spingi il bacino indietro, busto stabile, poi torna in piedi.'},
{id:'c3',name:'Shoulder press',sets:3,target:10,range:'10–12',desc:'Spingi l’elastico sopra la testa mantenendo l’addome attivo.'},
{id:'c4',name:'Affondi indietro',sets:2,target:10,range:'10 per gamba',desc:'Dieci ripetizioni per ciascuna gamba, contando una coppia come 1.'},
{id:'c5',name:'Crunch inversi',sets:2,target:15,range:'15–20',desc:'Solleva leggermente il bacino, senza slancio.'}]}];
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const SKEY='powerband-v1',safeLoad=()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch{return {}}};
let store=Object.assign({rest:60,sound:true,started:localDate(),history:[],overrides:{},session:null},safeLoad());
let view='home',detail='A',modal=null,lastBeepFor=null,wakeLock=null;
async function keepAwake(){try{if(navigator.wakeLock&&store.session&&!document.hidden&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch{}}
async function releaseWake(){try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch{}}
const $=s=>document.querySelector(s),save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(store))}catch{}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wd=['D','L','M','M','G','V','S'],plan=[null,'A','B','C','A','B','C'],days=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
function weekNo(){let a=new Date(store.started+'T12:00:00'),b=new Date();a.setHours(12,0,0,0);b.setHours(12,0,0,0);return Math.min(4,Math.max(1,Math.floor((b-a)/86400000/7)+1))}
function config(ex){const o=store.overrides[ex.id]||{};return {...ex,sets:o.sets??(weekNo()===1?Math.min(2,ex.sets):ex.sets),target:o.target??ex.target}}
function workout(id){return DATA.find(w=>w.id===id)||DATA[0]}
function allSetCount(id){return workout(id).ex.reduce((acc,ex)=>acc+config(ex).sets,0)}
function todayCode(){return plan[new Date().getDay()]}
function weekSessions(){const now=new Date(),day=now.getDay(),monday=new Date(now);monday.setDate(now.getDate()-(day||7)+1);monday.setHours(0,0,0,0);return store.history.filter(h=>h.endedAt>=monday.getTime()).length}
function duration(secs){const m=Math.floor(Math.max(0,secs)/60),s=Math.floor(Math.max(0,secs)%60);return `${m}:${String(s).padStart(2,'0')}`}
function header(){return `<div class="top"><div><div class="brand">POWER<b>BAND</b><span class="brand-sub">HOME TRAINING</span></div></div><div class="date">${new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'short'}).format(new Date())}</div></div>`}
function nav(){return `<nav class="nav" aria-label="Navigazione">${[['home','⌂','Oggi'],['plans','▤','Schede'],['history','◷','Storico'],['settings','⚙','Opzioni']].map(([id,icon,name])=>`<button class="nav-item ${view===id?'active':''}" data-action="nav" data-id="${id}"><span class="nav-icon">${icon}</span>${name}</button>`).join('')}</nav>`}
function tile(w){return `<button class="workout-tile" data-action="detail" data-id="${w.id}"><div class="tile-letter">${w.id}</div><div class="tile-mid"><div class="tile-name">${w.name}</div><div class="tile-desc">${w.ex.length} esercizi · ${allSetCount(w.id)} serie</div></div><span class="arrow">›</span></button>`}
function home(){let t=todayCode(),w=workout(t||'A'),wc=weekNo();return `${header()}<div class="eyebrow">IL TUO PIANO · SETTIMANA ${wc}/4</div><h1 class="headline">Allenati.<br><em>Riparti forte.</em></h1><p class="desc">Schede vere, power band, ripetizioni e recuperi sotto controllo.</p>${store.session?`<div class="section"><div class="notice">Hai un allenamento in corso. Puoi riprenderlo dal punto in cui eri rimasto.</div><button class="btn btn-primary btn-wide" style="margin-top:12px" data-action="resume">Riprendi allenamento →</button></div>`:''}<section class="section"><div class="card hero"><div class="hero-head"><span class="tag">${t?'OGGI IN PROGRAMMA':'OGGI RECUPERO'}</span><span class="subtle">${t?'20–25 minuti':'Giorno libero'}</span></div><div class="big-letter">${t||'✓'}</div><div class="workout-name">${t?w.name:'Recupero'}</div><div class="workout-details">${t?w.description:'Puoi comunque scegliere una delle schede.'}</div><button class="btn btn-primary btn-wide" data-action="${store.session?'resume':'start'}" data-id="${t||'A'}">${store.session?'Riprendi sessione':'Inizia allenamento →'}</button></div></section><section class="section"><div class="section-head"><h2 class="section-title">La tua settimana</h2><span class="subtle">${weekSessions()} sessioni completate</span></div><div class="week-grid">${[1,2,3,4,5,6,0].map((d,i)=>`<div class="weekday ${d===new Date().getDay()?'today':''} ${!plan[d]?'rest':''}"><span class="dayname">${days[d]}</span><span class="daycode">${plan[d]||'—'}</span></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2 class="section-title">Le tue schede</h2><button class="link" data-action="nav" data-id="plans">Vedi tutte</button></div><div class="workout-grid">${DATA.map(tile).join('')}</div></section><section class="section"><div class="stat-row"><div class="card stat"><div class="stat-number">${store.history.length}</div><div class="stat-caption">Allenamenti completati</div></div><div class="card stat"><div class="stat-number">${store.history.reduce((n,h)=>n+h.entries.length,0)}</div><div class="stat-caption">Serie completate</div></div></div></section><div class="footer-note">Piano personalizzabile · Dati salvati solo su questo dispositivo.</div>`}
function plans(){return `${header()}<div class="eyebrow">PROGRAMMA A · B · C</div><h1 class="headline">Le tue <em>schede.</em></h1><p class="desc">Scegli la seduta e modifica le serie o le ripetizioni in qualsiasi momento.</p><div class="section workout-grid">${DATA.map(tile).join('')}</div><div class="notice" style="margin-top:18px">Nella settimana 1 il piano parte con massimo 2 serie per esercizio. Dalla settimana 2 passa alle serie complete. Puoi sempre personalizzarlo.</div>`}
function detailPage(){const w=workout(detail);return `${header()}<div class="details-top"><button class="back" data-action="nav" data-id="plans">‹</button><div><div class="eyebrow">SCHEDA ${w.id} · ${w.type}</div><h1 class="detail-name">${w.name}</h1></div></div><p class="desc">${w.ex.length} esercizi · ${allSetCount(w.id)} serie · circa 20–25 minuti</p><div class="section card" style="padding-top:4px;padding-bottom:4px">${w.ex.map((ex,i)=>{let c=config(ex);return `<div class="exercise-row"><span class="index-circle">${i+1}</span><div class="exercise-content"><div class="exercise-title">${ex.name}</div><div class="exercise-detail">${ex.desc}</div></div><div class="exercise-metric">${c.sets} × ${c.target}${ex.id==='c4'?' /gamba':''}</div></div>`}).join('')}</div><div class="detail-actions"><button class="btn btn-primary" data-action="start" data-id="${w.id}">Inizia scheda →</button><button class="btn btn-secondary" data-action="edit" data-id="${w.id}">Modifica</button></div><p class="muted-note">L'obiettivo per ogni serie è indicativo: modifica le ripetizioni effettive durante l'allenamento. Lascia 1–3 ripetizioni di margine e cura la tecnica.</p>`}
function history(){return `${header()}<div class="eyebrow">REGISTRO ATTIVITÀ</div><h1 class="headline">I tuoi <em>progressi.</em></h1><p class="desc">Ogni serie completata viene registrata automaticamente alla fine della seduta.</p><section class="section card" style="padding:0">${store.history.length?store.history.slice().reverse().map(h=>{let w=workout(h.id),date=new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(h.endedAt));return `<div class="history-item"><div class="history-icon">${esc(h.id)}</div><div class="history-main"><div class="history-name">${w.name}</div><div class="history-sub">${date} · ${h.entries.length} serie · ${Math.round((h.endedAt-h.startedAt)/60000)} min</div></div><span style="color:var(--lime);font-size:20px">✓</span></div>`}).join(''):`<div class="empty">Nessun allenamento registrato.<br>Completa la prima scheda per iniziare.</div>`}</section><section class="section"><button class="btn btn-secondary btn-wide" data-action="export">Esporta dati allenamenti (.json)</button></section>`}
function settings(){return `${header()}<div class="eyebrow">PERSONALIZZAZIONE</div><h1 class="headline">Le tue <em>regole.</em></h1><div class="section card settings-card"><div class="settings-label">Recupero automatico dopo ogni serie</div><div class="options">${[30,45,60,75,90,120].map(n=>`<button class="pill ${store.rest===n?'active':''}" data-action="rest" data-value="${n}">${n}s</button>`).join('')}</div><div class="muted-note">Puoi saltare il timer o aggiungere 15 secondi durante la pausa.</div></div><div class="card settings-card"><div class="toggle-line"><div><div class="settings-label" style="margin:0">Suono fine recupero</div><div class="muted-note" style="margin-top:5px">Funziona se l'iPhone mantiene la pagina attiva e l'audio è abilitato.</div></div><button class="switch ${store.sound?'on':''}" data-action="sound" role="switch" aria-checked="${store.sound}" aria-label="Attiva o disattiva suono"><span class="knob"></span></button></div></div><div class="card settings-card"><div class="settings-label">Inizio programma 4 settimane</div><div class="field"><label for="start-date">Data di partenza</label><input type="date" id="start-date" value="${store.started}"></div><div class="muted-note">Ora sei nella settimana ${weekNo()}. Nella prima settimana hai al massimo 2 serie per esercizio, salvo modifiche manuali.</div></div><div class="card settings-card"><div class="settings-label">Backup e dati</div><button class="btn btn-secondary btn-wide" data-action="export">Esporta storico e impostazioni</button><label class="btn btn-secondary btn-wide" style="margin-top:10px;cursor:pointer" for="restore-input">Importa backup (.json)</label><input id="restore-input" type="file" accept="application/json,.json" style="display:none"><button class="btn btn-danger btn-wide" data-action="reset" style="margin-top:10px">Cancella tutti i dati</button></div><p class="muted-note">L'app conserva tutto localmente sul tuo iPhone, non invia dati a servizi esterni. Per evitare la perdita dello storico, esporta periodicamente un backup: puoi reimportarlo qui. Durante una sessione l’app prova a mantenere acceso lo schermo, ma i timer non garantiscono avvisi a schermo bloccato.</p>`}
function getEx(){let s=store.session;if(!s)return null;return config(workout(s.id).ex[s.exIndex])}
function sessionPage(){const s=store.session;if(!s){view='home';return home()}const w=workout(s.id),ex=getEx();if(!ex){return '<div>Sessione non disponibile.</div>'}const total=w.ex.reduce((n,e)=>n+config(e).sets,0),progress=Math.round(s.entries.length/total*100),resting=s.restUntil!==null;return `<div class="workout-mode"><div class="running-top"><div class="eyebrow">ALLENAMENTO ${w.id} · IN CORSO</div><button class="small-btn" data-action="pause">Esci ↗</button></div><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2 class="section-title">${w.name}</h2><span class="subtle">${s.entries.length}/${total} serie</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>${resting?restPage(s,ex):activePage(s,ex)}<div class="footer-note">La sessione viene salvata se esci o chiudi l'app. Per un timer affidabile lascia l'app aperta con lo schermo acceso.</div></div>`}
function activePage(s,ex){const si=s.setIndex;return `<div class="card exercise-hero"><div class="step-badge">ESERCIZIO ${s.exIndex+1} DI ${workout(s.id).ex.length} · SERIE ${si+1}/${ex.sets}</div><div class="active-ex-title">${ex.name}</div><p class="detail-notes">${ex.desc}</p><p class="rep-range">Obiettivo: ${ex.range} ripetizioni</p><div class="counter"><button class="count-button" data-action="decrease" aria-label="Riduci ripetizioni">−</button><span class="count-number">${s.repsDraft}</span><button class="count-button" data-action="increase" aria-label="Aumenta ripetizioni">+</button></div><div class="count-label">RIPETIZIONI ESEGUITE${ex.id==='c4'?' PER GAMBA':''}</div><button class="btn btn-primary btn-wide" data-action="complete-set">✓ Completa serie</button><div class="set-dots">${Array.from({length:ex.sets},(_,i)=>`<span class="set-dot ${i<si?'done':''} ${i===si?'current':''}"></span>`).join('')}</div></div><div class="next-ex"><div class="eyebrow" style="margin-bottom:7px">${s.exIndex+1<workout(s.id).ex.length?'DOPO QUESTO ESERCIZIO':'ULTIMO ESERCIZIO'}</div><div class="exercise-title">${s.exIndex+1<workout(s.id).ex.length?workout(s.id).ex[s.exIndex+1].name:'Completa la seduta'}</div></div><div class="session-actions" style="margin-top:15px"><button class="btn btn-secondary btn-wide" data-action="finish-early">Termina allenamento</button></div>`}
function restPage(s,ex){let remain=Math.max(0,Math.ceil((s.restUntil-Date.now())/1000)),target=s.restTotal||store.rest,pct=Math.round(Math.min(100,remain/target*100));return `<div class="rest-card"><div class="eyebrow">${remain?'RECUPERO':'RECUPERO COMPLETATO'}</div><div class="timer-disc" id="timer-disc" style="background:conic-gradient(var(--lime) ${pct}%,#3a4732 ${pct}%)"><div class="timer-content"><div class="timer-number" id="timer-number">${duration(remain)}</div><div class="timer-sec">MIN : SEC</div></div></div><h2 class="section-title">${remain?'Respira. Si riparte.':'Pronto per la prossima serie.'}</h2><div class="subtle" style="margin-top:10px">In arrivo: ${ex.name} · serie ${s.setIndex+1}/${ex.sets}</div><div class="time-actions"><button class="btn btn-secondary" data-action="add-time">+15 sec</button><button class="btn btn-primary" data-action="skip-rest">${remain?'Salta':'Continua'} →</button></div></div>`}
function editModal(){const w=workout(modal.id);return `<div class="modal-shade" data-action="close-shade"><div class="modal" role="dialog" aria-modal="true" aria-label="Modifica scheda"><div class="modal-header"><div><div class="eyebrow">PERSONALIZZA SCHEDA ${w.id}</div><h2>${w.name}</h2></div><button class="back" data-action="close-modal" aria-label="Chiudi">×</button></div><form id="edit-form"><input type="hidden" name="workout" value="${w.id}">${w.ex.map(ex=>{let c=config(ex);return `<div class="edit-row"><div class="edit-title">${ex.name}</div><div class="edit-input-row"><div class="field"><label for="sets-${ex.id}">Serie</label><input id="sets-${ex.id}" type="number" inputmode="numeric" name="sets-${ex.id}" min="1" max="8" value="${c.sets}" required></div><div class="field"><label for="reps-${ex.id}">Ripetizioni</label><input id="reps-${ex.id}" type="number" inputmode="numeric" name="reps-${ex.id}" min="1" max="100" value="${c.target}" required></div></div></div>`}).join('')}<button class="btn btn-primary btn-wide" type="submit">Salva scheda</button><button class="btn btn-ghost btn-wide" type="button" data-action="default" data-id="${w.id}" style="margin-top:6px">Ripristina valori iniziali</button></form></div></div>`}
function render(){const app=$('#app');if(!app)return;const onSession=view==='session';app.innerHTML=(onSession?sessionPage():view==='home'?home():view==='plans'?plans():view==='detail'?detailPage():view==='history'?history():settings())+(onSession?'':nav())+(modal?editModal():'');document.title=`${onSession?'Allenamento in corso':'PowerBand Coach'} · PowerBand`;if(onSession&&store.session?.restUntil!==null)tick();}
function start(id){if(store.session){if(confirm('Hai già un allenamento in corso. Vuoi riprenderlo?\nPremi Annulla per scegliere se terminare quello attuale.')){view='session';render();return}if(!confirm('Scartare la sessione in corso e iniziarne una nuova?'))return}let w=workout(id);store.session={id:w.id,startedAt:Date.now(),exIndex:0,setIndex:0,entries:[],repsDraft:config(w.ex[0]).target,restUntil:null,restTotal:store.rest};view='session';save();keepAwake();render()}
function beep(){if(!store.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.setValueAtTime(1100,c.currentTime+.12);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.13,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.32);o.start();o.stop(c.currentTime+.34);o.onended=()=>c.close()}catch{}}
function tick(){const s=store.session;if(view!=='session'||!s||s.restUntil===null)return;let diff=Math.max(0,Math.ceil((s.restUntil-Date.now())/1000));let el=$('#timer-number'),disc=$('#timer-disc');if(el)el.textContent=duration(diff);if(disc){let pct=Math.max(0,Math.min(100,diff/(s.restTotal||store.rest)*100));disc.style.background=`conic-gradient(var(--lime) ${pct}%,#3a4732 ${pct}%)`;}if(!diff){if(lastBeepFor!==s.restUntil){lastBeepFor=s.restUntil;beep();render()}}}
function nextSet(){let s=store.session;if(!s)return;let w=workout(s.id),ex=config(w.ex[s.exIndex]);s.entries.push({exId:ex.id,name:ex.name,set:s.setIndex+1,reps:s.repsDraft,at:Date.now()});if(s.setIndex+1<ex.sets){s.setIndex++}else if(s.exIndex+1<w.ex.length){s.exIndex++;s.setIndex=0}else{finish();return}ex=config(w.ex[s.exIndex]);s.repsDraft=ex.target;s.restTotal=store.rest;s.restUntil=Date.now()+store.rest*1000;lastBeepFor=null;save();render()}
function finish(){let s=store.session;if(!s)return;const complete={id:s.id,startedAt:s.startedAt,endedAt:Date.now(),entries:s.entries};store.history.push(complete);store.session=null;releaseWake();view='history';save();render();alert(`Allenamento ${complete.id} salvato: ${complete.entries.length} serie completate.`)}
function exportData(){let payload={app:'PowerBand Coach',version:1,exportedAt:new Date().toISOString(),...store};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='powerband-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'nav':view=id;modal=null;render();break;case'detail':detail=id;view='detail';render();break;case'start':start(id);break;case'resume':view='session';keepAwake();render();break;case'pause':releaseWake();view='home';render();break;case'edit':modal={id};render();break;case'close-modal':modal=null;render();break;case'close-shade':if(e.target===b){modal=null;render()}break;case'decrease':store.session.repsDraft=Math.max(0,store.session.repsDraft-1);save();render();break;case'increase':store.session.repsDraft=Math.min(200,store.session.repsDraft+1);save();render();break;case'complete-set':nextSet();break;case'skip-rest':store.session.restUntil=null;save();render();break;case'add-time':store.session.restUntil=Math.max(Date.now(),store.session.restUntil)+15000;store.session.restTotal=Math.ceil((store.session.restUntil-Date.now())/1000);lastBeepFor=null;save();render();break;case'rest':store.rest=Number(b.dataset.value);save();render();break;case'sound':store.sound=!store.sound;save();render();break;case'finish-early':if(confirm('Terminare la seduta e salvare le serie completate?'))finish();break;case'export':exportData();break;case'reset':if(confirm('Cancellare tutto lo storico, le personalizzazioni e la sessione in corso?')){localStorage.removeItem(SKEY);location.reload()}break;case'default':workout(id).ex.forEach(x=>delete store.overrides[x.id]);save();render();break;}});
document.addEventListener('submit',e=>{if(e.target.id!=='edit-form')return;e.preventDefault();let w=workout(modal.id),f=new FormData(e.target);for(const ex of w.ex){let sets=Number(f.get('sets-'+ex.id)),target=Number(f.get('reps-'+ex.id));if(!(sets>=1&&sets<=8&&target>=1&&target<=100)){alert('Inserisci da 1 a 8 serie e da 1 a 100 ripetizioni.');return}store.overrides[ex.id]={sets,target}}modal=null;save();render()});
document.addEventListener('change',async e=>{if(e.target.id==='restore-input'){let file=e.target.files?.[0];if(!file)return;try{let raw=JSON.parse(await file.text());if(raw.app!=='PowerBand Coach'||!Array.isArray(raw.history)||!raw.overrides||typeof raw.rest!=='number')throw new Error('Formato non valido');if(confirm('Importare il backup? Sostituirà lo storico e le impostazioni su questo dispositivo.')){store={rest:raw.rest,sound:raw.sound!==false,started:raw.started||localDate(),history:raw.history,overrides:raw.overrides,session:null};save();view='home';render()}}catch{alert('Questo file non è un backup PowerBand valido.')}return}if(e.target.id==='start-date'&&/^\d{4}-\d\d-\d\d$/.test(e.target.value)){store.started=e.target.value;save();render()}});
setInterval(()=>{if(view==='session'&&store.session?.restUntil!==null)tick()},250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='session'){keepAwake();if(store.session?.restUntil!==null)tick()}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
</body>
</html>
